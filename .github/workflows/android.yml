name: Android checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject access values, keys and local paths
        run: sh tools/check-secrets.sh
      # Every new commit, so a value added and removed again later is still refused.
      - name: Check each pushed commit
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"
          else range="origin/main..HEAD"; fi
          sh tools/check-secrets.sh --range "$range"
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Demo API contract tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
